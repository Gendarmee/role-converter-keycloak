plugins {
    id 'java'
    id 'maven-publish'
}

group = 'com.gendarme'
version = '1.0.0'
description = 'role-converter'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-security:3.4.4'
    implementation 'org.springframework.security:spring-security-oauth2-resource-server:6.4.4'
    implementation 'org.springframework.security:spring-security-oauth2-jose:6.4.4'

    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server:3.4.4'

    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.4.4'
    testImplementation 'org.springframework.security:spring-security-test:6.4.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
    failOnError = false
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'Role Converter'
                description = 'Role converter utility for Spring Security'
                url = 'http://nexus.gendarme.com'

                licenses {
                    license {
                        name = 'Proprietary'
                        url = 'http://www.gendarme.com/license'
                    }
                }

                developers {
                    developer {
                        id = 'gendarme'
                        name = 'Gendarme Team'
                        email = 'dev@gendarme.com'
                    }
                }
            }
        }
    }

    repositories {
        maven {
            name = 'nexus'
            url = 'http://localhost:8081/repository/shared-components/'
            allowInsecureProtocol = true
            credentials {
                username = project.findProperty('nexusUsername') ?: System.getenv('NEXUS_USERNAME')
                password = project.findProperty('nexusPassword') ?: System.getenv('NEXUS_PASSWORD')
            }
        }
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    suppressedValidationErrors.add('dependencies-without-versions')
}