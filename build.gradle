plugins {
    id 'java-library'
    id 'maven-publish'
}

group = findProperty('group') ?: 'com.gendarme'
version = findProperty('version') ?: '1.0.3'
description = 'Keycloak JWT role converter for Spring Security'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    api 'org.springframework.boot:spring-boot-autoconfigure:3.4.4'
    api 'org.springframework.security:spring-security-oauth2-resource-server:6.4.4'
    api 'org.springframework.security:spring-security-oauth2-jose:6.4.4'

    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.4.4'
    testImplementation 'org.springframework.security:spring-security-test:6.4.4'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
    failOnError = false
}
